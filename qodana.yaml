####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-jvm:2026.1
projectJDK: "21"
profile:
  name: qodana.recommended
baseline: qodana.sarif.json
include:
  - name: JavaSecurityApp
  - name: KotlinInternalOracle
licenseRules:
  - keys:
      - "Apache-2.0"
    allowed:
      - "Apache-2.0"
      - "MIT"
      - "BSD-3-Clause"
      - "BSD-2-Clause"
      - "BSD-3-CLAUSE-NO-TRADEMARK"
      - "Public-Domain"
      - "EPL-2.0"
      - "EPL-1.0"
      - "CDDL-1.1"
      - "CDDL-1.0"
      - "Bouncy-Castle"
exclude:
  - name: "SuspiciousLicense"
    paths:
      - "thirdPartySoftwareList-2.json"
  - name: All
    paths:
      - backend-web/src/main/java/com/kefir/infrastructure/config/metrics/LoanActiveState.java
      - backend-web/src/main/java/com/kefir/infrastructure/config/metrics/LoanInactiveState.java