# Swaps out Redis for an in-memory ConcurrentHashMap during tests
spring.cache.type=simple
JWT_SECRET=somemocksecretkeythatislongenoughforvalidation

# 1. Disable Redis repositories if any exist
spring.data.redis.repositories.enabled=false

# 2. Forcefully exclude all Redis auto-configurations from loading
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.liquibase.enabled=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml