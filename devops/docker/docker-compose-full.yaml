services:
  db:
    build: postgres-custom
    container_name: kefir-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Kefir
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./postgres-docker/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres-docker/init-pgaudit.sql:/docker-entrypoint-initdb.d/init-pgaudit.sql
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend-web   # Construye la imagen localmente
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ../../backend-web/.env

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
