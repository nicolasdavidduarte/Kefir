services:
  db:
    build: postgres-custom
    container_name: kefir-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kefir_db
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: postgres -c listen_addresses='*' -c port=5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: devops/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    image: kefir-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend