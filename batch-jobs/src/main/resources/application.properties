spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kefir_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.address=0.0.0.0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.batch.jdbc.initialize-schema=always

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.batch.job.enabled=true

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.web.server.enabled=true
management.metrics.tags.application=kefir-batch-jobs
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:local}

sns.topic.arn=arn:aws:sns:sa-east-1:373901294333:loan-created-topic

logging.level.org.kefir=INFO
logging.level.software.amazon.awssdk=INFO
logging.level.org.kefir.infrastructure.messaging=INFO
logging.level.root=INFO
